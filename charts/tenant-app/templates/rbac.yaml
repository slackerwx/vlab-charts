apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.tenant }}-viewer
rules:
  - apiGroups: ["", "apps"]
    resources: [pods, pods/log, services, deployments, replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.tenant }}-viewers
subjects:
  - kind: Group
    name: "tenant:{{ .Values.tenant }}:viewers"
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: {{ .Values.tenant }}-viewer
  apiGroup: rbac.authorization.k8s.io
